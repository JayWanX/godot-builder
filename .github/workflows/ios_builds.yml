name: 🍏 iOS Builds
on:
  workflow_call:
    inputs:
      repository:
        description: Godot engine source repository (owner/repo).
        required: false
        default: godotengine/godot
        type: string
      repo-safe:
        description: Repository name with '/' replaced by '_' (safe for artifact names).
        required: false
        default: ""
        type: string
      engine-sha:
        description: Resolved commit SHA of the engine ref (cache key stability).
        required: false
        default: ""
        type: string
      ref:
        description: Branch, tag, or commit SHA of the engine source.
        required: false
        default: master
        type: string
      target:
        description: Build target (editor, template_debug, template_release).
        required: false
        default: template_release
        type: string
      scons-flags:
        description: Additional SCons flags appended to the build.
        required: false
        default: ""
        type: string
      profile:
        description: >-
          custom.py source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      gdbuild:
        description: >-
          .gdbuild build profile source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      custom-modules:
        description: Comma-separated custom module repositories in "owner/repo[@ref]" form.
        required: false
        default: ""
        type: string
      encryption-key:
        description: >-
          Godot script encryption key (hexadecimal string). Exported as
          SCRIPT_AES256_ENCRYPTION_KEY and picked up automatically by Godot's SConstruct.
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload build artifacts.
        required: false
        default: true
        type: boolean
    secrets:
      GIT_PAT:
        description: "GitHub token for private repositories (repo: mode / custom-modules)."
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: Godot engine source repository (owner/repo).
        required: false
        default: godotengine/godot
        type: string
      repo-safe:
        description: Repository name with '/' replaced by '_' (safe for artifact names).
        required: false
        default: ""
        type: string
      engine-sha:
        description: Resolved commit SHA of the engine ref (cache key stability).
        required: false
        default: ""
        type: string
      ref:
        description: Branch, tag, or commit SHA of the engine source.
        required: false
        default: master
        type: string
      target:
        description: Build target.
        required: false
        default: template_release
        type: choice
        options: [editor, template_debug, template_release]
      scons-flags:
        description: Additional SCons flags appended to the build.
        required: false
        default: ""
        type: string
      profile:
        description: >-
          custom.py source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      gdbuild:
        description: >-
          .gdbuild build profile source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      custom-modules:
        description: Comma-separated custom module repositories in "owner/repo[@ref]" form.
        required: false
        default: ""
        type: string
      encryption-key:
        description: >-
          Godot script encryption key (hexadecimal string). Exported as
          SCRIPT_AES256_ENCRYPTION_KEY and picked up automatically by Godot's SConstruct.
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload build artifacts.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ios-template:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-26
    name: Build (target=${{ inputs.target }})
    timeout-minutes: 60

    steps:
      - name: Checkout engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GIT_PAT || github.token }}
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ inputs.repo-safe || replace(inputs.repository, '/', '_') }}-ios
          engine-sha: ${{ inputs.engine-sha }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Inject build configuration (custom.py / .gdbuild / custom modules / env)
        id: inject
        uses: ./.github/actions/godot-config-inject
        with:
          profile: ${{ inputs.profile }}
          gdbuild: ${{ inputs.gdbuild }}
          custom-modules: ${{ inputs.custom-modules }}
          encryption-key: ${{ inputs.encryption-key }}
          repo-token: ${{ secrets.GIT_PAT }}

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ inputs.scons-flags }}
          platform: ios
          target: ${{ inputs.target }}
          build-profile: ${{ steps.inject.outputs.build-profile }}
          profile-path: ${{ steps.inject.outputs.profile-path }}
          custom-modules-dir: ${{ steps.inject.outputs.custom-modules-dir }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ inputs.repo-safe || replace(inputs.repository, '/', '_') }}-ios
          engine-sha: ${{ inputs.engine-sha }}
        continue-on-error: true

      - name: Upload artifact
        if: inputs.upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.repo-safe || replace(inputs.repository, '/', '_') }}-ios-${{ inputs.target }}
