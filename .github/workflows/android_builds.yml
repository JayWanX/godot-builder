name: 🤖 Android Builds
on:
  workflow_call:
    inputs:
      repository:
        description: Godot engine source repository (owner/repo).
        required: false
        default: godotengine/godot
        type: string
      repo-safe:
        description: Repository name with '/' replaced by '_' (safe for artifact names).
        required: false
        default: ""
        type: string
      engine-sha:
        description: Resolved commit SHA of the engine ref (cache key stability).
        required: false
        default: ""
        type: string
      ref:
        description: Branch, tag, or commit SHA of the engine source.
        required: false
        default: master
        type: string
      target:
        description: Build target (editor, template_debug, template_release).
        required: false
        default: editor
        type: string
      scons-flags:
        description: Additional SCons flags appended to the build.
        required: false
        default: ""
        type: string
      profile:
        description: >-
          custom.py source (empty = skip, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      gdbuild:
        description: >-
          .gdbuild build profile source (empty = skip, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      custom-modules:
        description: Comma-separated custom module repositories in "owner/repo[@ref]" form.
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload build artifacts.
        required: false
        default: true
        type: boolean
    secrets:
      SERVICE_ACCOUNT_KEY:
        required: true
      GIT_PAT:
        description: "GitHub token for private repositories (repo: mode / custom-modules)."
        required: false
      ENCRYPTION_KEY:
        description: "Godot PCK encryption key (hex). Empty = no PCK encryption."
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: Godot engine source repository (owner/repo).
        required: false
        default: godotengine/godot
        type: string
      repo-safe:
        description: Repository name with '/' replaced by '_' (safe for artifact names).
        required: false
        default: ""
        type: string
      engine-sha:
        description: Resolved commit SHA of the engine ref (cache key stability).
        required: false
        default: ""
        type: string
      ref:
        description: Branch, tag, or commit SHA of the engine source.
        required: false
        default: master
        type: string
      target:
        description: Build target.
        required: false
        default: editor
        type: choice
        options: [editor, template_debug, template_release]
      scons-flags:
        description: Additional SCons flags appended to the build.
        required: false
        default: ""
        type: string
      profile:
        description: >-
          custom.py source (empty = skip, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      gdbuild:
        description: >-
          .gdbuild build profile source (empty = skip, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      custom-modules:
        description: Comma-separated custom module repositories in "owner/repo[@ref]" form.
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload build artifacts.
        required: false
        default: true
        type: boolean

permissions:
  contents: read    # 读取仓库内容（检出用）
  actions: write    # 上传构建产物 artifact

jobs:
  build-android:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor)
            cache-name: android-editor
            target: editor
            scons-flags: arch=arm64

          - name: Template arm64 (target=template_debug, arch=arm64)
            cache-name: android-template-arm64
            target: template_debug
            scons-flags: arch=arm64

    steps:
      - name: Checkout engine source
        if: matrix.target == inputs.target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GIT_PAT || github.token }}
          submodules: recursive

      - name: Set up Java 17
        if: matrix.target == inputs.target
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        if: matrix.target == inputs.target
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ inputs.repo-safe || github.event.repository.name }}-${{ matrix.cache-name }}
          engine-sha: ${{ inputs.engine-sha }}
        continue-on-error: true

      - name: Setup Python and SCons
        if: matrix.target == inputs.target
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        if: matrix.target == inputs.target
        shell: bash
        run: python ./misc/scripts/install_swappy_android.py

      - name: Inject build configuration (custom.py / .gdbuild / custom modules / env)
        if: matrix.target == inputs.target
        id: inject
        uses: ./.github/actions/godot-config-inject
        with:
          profile: ${{ inputs.profile }}
          gdbuild: ${{ inputs.gdbuild }}
          custom-modules: ${{ inputs.custom-modules }}
          encryption-key: ${{ secrets.ENCRYPTION_KEY }}
          repo-token: ${{ secrets.GIT_PAT }}

      - name: 检出 GodotBuilder 辅助脚本
        if: matrix.target == inputs.target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: godot_builder
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/scripts

      - name: 确保标准头显式包含（兼容新版编译器）
        if: matrix.target == inputs.target
        shell: bash
        run: python godot_builder/.github/scripts/ensure_standard_includes.py

      - name: Compilation
        if: matrix.target == inputs.target
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ matrix.scons-flags }} ${{ inputs.scons-flags }}
          platform: android
          target: ${{ inputs.target }}
          build-profile-path: ${{ steps.inject.outputs.build-profile-path }}
          scons-profile-path: ${{ steps.inject.outputs.scons-profile-path }}
          custom-modules-dir: ${{ steps.inject.outputs.custom-modules-dir }}

      - name: Save Godot build cache
        if: matrix.target == inputs.target
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ inputs.repo-safe || github.event.repository.name }}-${{ matrix.cache-name }}
          engine-sha: ${{ inputs.engine-sha }}
        continue-on-error: true

      - name: Generate Godot templates
        if: matrix.target == inputs.target && inputs.target == 'template_debug'
        shell: bash
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/

      - name: Generate Godot editor
        if: matrix.target == inputs.target && inputs.target == 'editor'
        shell: bash
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          ./gradlew generateGodotHorizonOSEditor
          ./gradlew generateGodotPicoOSEditor
          cd ../../..
          ls -l bin/android_editor_builds/

          # Separate different editors for multiple artifacts
          mkdir horizonos
          mv bin/android_editor_builds/*-horizonos-* horizonos
          mkdir picoos
          mv bin/android_editor_builds/*-picoos-* picoos

      - name: Prepare artifact
        if: matrix.target == inputs.target && inputs.upload-artifact
        shell: bash
        run: |
          rm -rf bin/build_deps bin/android_build

      - name: Smoke test (template output)
        if: matrix.target == inputs.target && inputs.target == 'template_debug'
        shell: bash
        run: |
          test -n "$(ls bin/*.aar 2>/dev/null)" || test -n "$(ls bin/*.zip 2>/dev/null)" \
            || { echo "::error::no Android template artifacts produced in bin/"; exit 1; }

      - name: Smoke test (editor output)
        if: matrix.target == inputs.target && inputs.target == 'editor'
        shell: bash
        run: |
          test -n "$(ls bin/android_editor_builds/*.apk 2>/dev/null)" \
            || { echo "::error::no Android editor APK produced"; exit 1; }

      - name: Upload artifact
        if: matrix.target == inputs.target && inputs.upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.repo-safe || github.event.repository.name }}-${{ matrix.cache-name }}

      - name: Upload artifact (Horizon OS)
        if: matrix.target == inputs.target && inputs.target == 'editor' && inputs.upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.repo-safe || github.event.repository.name }}-${{ matrix.cache-name }}-horizonos
          path: horizonos

      - name: Upload artifact (PICO OS)
        if: matrix.target == inputs.target && inputs.target == 'editor' && inputs.upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.repo-safe || github.event.repository.name }}-${{ matrix.cache-name }}-picoos
          path: picoos
