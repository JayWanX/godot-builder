name: 🔨 Build & Export GodotBuilder

on:
  workflow_dispatch:
    inputs:
      engine-ref:
        description: Godot 引擎引用（发布标签，如 4.7.2-stable），用于检出模板源码并下载同名编辑器。
        required: false
        default: 4.7.2-stable
        type: string
      target:
        description: 构建的模板目标。
        required: false
        default: template_release
        type: choice
        options:
          - template_debug
          - template_release
      presets:
        description: 要导出的预设名称（build/export_presets.cfg 中的 name，逗号分隔）。
        required: false
        default: Windows Desktop,Linux/X11,macOS
        type: string
      encryption-key:
        description: 脚本加密密钥（十六进制，至少 16 位）。留空则关闭 PCK 加密。
        required: false
        default: ""
        type: string
      upload-artifact:
        description: 是否上传导出产物。
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}|${{ inputs.engine-ref }}|${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build-templates-linux:
    name: 构建 Linux / Windows 模板
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 检出 Godot 引擎源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: godotengine/godot
          ref: ${{ inputs.engine-ref }}
          token: ${{ secrets.GIT_PAT || github.token }}
          fetch-depth: 1
          submodules: false

      - name: 检出 GodotBuilder 项目（获取 build/ 配置）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gb
          fetch-depth: 1

      - name: 解析引擎提交 SHA
        id: engine-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 设置 Python 与 SCons
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      - name: 安装 SCons
        run: |
          python -m pip install scons==4.11.0
          scons --version

      - name: 恢复构建缓存
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: .scons_cache/
          key: gb-self-lxw|${{ steps.engine-sha.outputs.sha }}|${{ github.sha }}
          restore-keys: |
            gb-self-lxw|${{ steps.engine-sha.outputs.sha }}
            gb-self-lxw|${{ github.ref_name }}
            gb-self-lxw|${{ github.event.repository.default_branch }}

      - name: 注入构建配置（custom.py + project.gdbuild）
        run: |
          cp gb/build/profile.py custom.py
          cp gb/build/project.gdbuild project.gdbuild
          sed -i 's|\.\./project\.gdbuild|project.gdbuild|' custom.py
          grep -n build_profile custom.py

      - name: 构建 Linux 模板
        run: |
          scons platform=linuxbsd arch=x86_64 target=${{ inputs.target }} profile=custom.py build_profile=project.gdbuild cache_path=.scons_cache/ redirect_build_objects=no
          ls -lh bin/

      - name: 统一 Linux 模板文件名
        run: |
          shopt -s nullglob
          files=(bin/godot.linuxbsd.template_${{ inputs.target }}*x86_64)
          [ ${#files[@]} -eq 1 ] || { echo "模板文件不唯一：${files[*]}"; ls -lh bin/; exit 1; }
          mv "${files[0]}" "bin/godot.linuxbsd.template_${{ inputs.target }}.x86_64"

      - name: 安装 MinGW（Windows 交叉编译）
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: 构建 Windows 模板
        run: |
          scons platform=windows use_mingw=yes arch=x86_64 target=${{ inputs.target }} profile=custom.py build_profile=project.gdbuild cache_path=.scons_cache/ redirect_build_objects=no
          ls -lh bin/

      - name: 统一 Windows 模板文件名
        run: |
          shopt -s nullglob
          files=(bin/godot.windows.template_${{ inputs.target }}*.exe)
          [ ${#files[@]} -eq 1 ] || { echo "模板文件不唯一：${files[*]}"; ls -lh bin/; exit 1; }
          mv "${files[0]}" "bin/godot.windows.template_${{ inputs.target }}.x86_64.exe"

      - name: 保存构建缓存
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.scons_cache/
          key: gb-self-lxw|${{ steps.engine-sha.outputs.sha }}|${{ github.sha }}

      - name: 上传 Linux 模板
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-linux
          path: bin/godot.linuxbsd.template_*.x86_64
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Windows 模板
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-windows
          path: bin/godot.windows.template_*.x86_64.exe
          if-no-files-found: error
          retention-days: 7

  build-template-macos:
    name: 构建 macOS 模板
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: 检出 Godot 引擎源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: godotengine/godot
          ref: ${{ inputs.engine-ref }}
          token: ${{ secrets.GIT_PAT || github.token }}
          fetch-depth: 1
          submodules: false

      - name: 检出 GodotBuilder 项目（获取 build/ 配置）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gb
          fetch-depth: 1

      - name: 解析引擎提交 SHA
        id: engine-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 设置 Python 与 SCons
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      - name: 安装 SCons
        run: |
          python -m pip install scons==4.11.0
          scons --version

      - name: 恢复构建缓存
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: .scons_cache/
          key: gb-self-macos|${{ steps.engine-sha.outputs.sha }}|${{ github.sha }}
          restore-keys: |
            gb-self-macos|${{ steps.engine-sha.outputs.sha }}
            gb-self-macos|${{ github.ref_name }}
            gb-self-macos|${{ github.event.repository.default_branch }}

      - name: 注入构建配置（custom.py + project.gdbuild）
        run: |
          cp gb/build/profile.py custom.py
          cp gb/build/project.gdbuild project.gdbuild
          sed -i 's|\.\./project\.gdbuild|project.gdbuild|' custom.py
          grep -n build_profile custom.py

      - name: 构建 macOS 模板（universal）
        run: |
          scons platform=macos arch=universal target=${{ inputs.target }} profile=custom.py build_profile=project.gdbuild cache_path=.scons_cache/ redirect_build_objects=no
          ls -lh bin/

      - name: 统一 macOS 模板文件名
        run: |
          shopt -s nullglob
          files=(bin/godot.macos.template_${{ inputs.target }}*universal)
          [ ${#files[@]} -eq 1 ] || { echo "模板文件不唯一：${files[*]}"; ls -lh bin/; exit 1; }
          mv "${files[0]}" "bin/godot.macos.template_${{ inputs.target }}.universal"

      - name: 保存构建缓存
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.scons_cache/
          key: gb-self-macos|${{ steps.engine-sha.outputs.sha }}|${{ github.sha }}

      - name: 上传 macOS 模板
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-macos
          path: bin/godot.macos.template_*.universal
          if-no-files-found: error
          retention-days: 7

  export:
    name: 导出并上传成品
    needs: [build-templates-linux, build-template-macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GODOT_VERSION: ${{ inputs.engine-ref }}
      PRESETS: ${{ inputs.presets }}
      SCRIPT_KEY: ${{ inputs.encryption-key }}
    steps:
      - name: 检出 GodotBuilder 项目
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 校验输入
        run: |
          if ! [[ "$GODOT_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::engine-ref 含非法字符"; exit 1
          fi
          if [ -z "$PRESETS" ]; then
            echo "::error::presets 不能为空"; exit 1
          fi
          if ! [[ "$PRESETS" =~ ^[A-Za-z0-9 /,_-]+$ ]]; then
            echo "::error::presets 含非法字符"; exit 1
          fi
          if [ -n "$SCRIPT_KEY" ] && ! [[ "$SCRIPT_KEY" =~ ^[0-9a-fA-F]{16,}$ ]]; then
            echo "::error::encryption-key 必须为十六进制且至少 16 位"; exit 1
          fi

      - name: 安装编辑器运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2 libpulse0 unzip

      - name: 下载 Godot 编辑器
        run: |
          curl -L --retry 3 -o editor.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o editor.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          ./Godot_v${GODOT_VERSION}_linux.x86_64 --version

      - name: 下载构建的模板
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: templates
          merge-multiple: true

      - name: 生成导出预设
        run: |
          mkdir -p bin
          sed "s|@TEMPLATES_DIR@|$PWD/templates|g" build/export_presets.cfg > export_presets.cfg
          if [ -z "$SCRIPT_KEY" ]; then
            sed -i 's/encrypt_pck=true/encrypt_pck=false/; s/encrypt_directory=true/encrypt_directory=false/' export_presets.cfg
          fi
          echo "--- export_presets.cfg ---"
          grep -E 'name=|custom_template/|encrypt_|export_path=' export_presets.cfg

      - name: 导出各预设
        run: |
          FLAG="--export-release"
          if [ "${{ inputs.target }}" = "template_debug" ]; then FLAG="--export-debug"; fi
          echo "$PRESETS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | while read -r preset; do
            [ -z "$preset" ] && continue
            echo "==> 导出预设：$preset"
            if [ -n "$SCRIPT_KEY" ]; then
              ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script-encryption-key "$SCRIPT_KEY" $FLAG "$preset"
            else
              ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . $FLAG "$preset"
            fi
          done
          echo "--- bin/ ---"
          ls -lh bin/

      - name: 上传导出产物
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GodotBuilder-${{ inputs.engine-ref }}-${{ inputs.target }}
          path: bin/*
          if-no-files-found: error
          retention-days: 30
