name: 🍎 macOS Builds
on:
  workflow_call:
    inputs:
      repository:
        description: Godot engine source repository (owner/repo).
        required: false
        default: godotengine/godot
        type: string
      repo-safe:
        description: Repository name with '/' replaced by '_' (safe for artifact names).
        required: false
        default: ""
        type: string
      engine-sha:
        description: Resolved commit SHA of the engine ref (cache key stability).
        required: false
        default: ""
        type: string
      ref:
        description: Branch, tag, or commit SHA of the engine source.
        required: false
        default: master
        type: string
      target:
        description: Build target (editor, template_debug, template_release).
        required: false
        default: editor
        type: string
      scons-flags:
        description: Additional SCons flags appended to the build.
        required: false
        default: ""
        type: string
      profile:
        description: >-
          custom.py source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      gdbuild:
        description: >-
          .gdbuild build profile source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      custom-modules:
        description: Comma-separated custom module repositories in "owner/repo[@ref]" form.
        required: false
        default: ""
        type: string
      encryption-key:
        description: >-
          Godot script encryption key (hexadecimal string). Exported as
          SCRIPT_AES256_ENCRYPTION_KEY and picked up automatically by Godot's SConstruct.
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload build artifacts.
        required: false
        default: true
        type: boolean
    secrets:
      GIT_PAT:
        description: "GitHub token for private repositories (repo: mode / custom-modules)."
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: Godot engine source repository (owner/repo).
        required: false
        default: godotengine/godot
        type: string
      repo-safe:
        description: Repository name with '/' replaced by '_' (safe for artifact names).
        required: false
        default: ""
        type: string
      engine-sha:
        description: Resolved commit SHA of the engine ref (cache key stability).
        required: false
        default: ""
        type: string
      ref:
        description: Branch, tag, or commit SHA of the engine source.
        required: false
        default: master
        type: string
      target:
        description: Build target.
        required: false
        default: editor
        type: choice
        options: [editor, template_debug, template_release]
      scons-flags:
        description: Additional SCons flags appended to the build.
        required: false
        default: ""
        type: string
      profile:
        description: >-
          custom.py source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      gdbuild:
        description: >-
          .gdbuild build profile source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      custom-modules:
        description: Comma-separated custom module repositories in "owner/repo[@ref]" form.
        required: false
        default: ""
        type: string
      encryption-key:
        description: >-
          Godot script encryption key (hexadecimal string). Exported as
          SCRIPT_AES256_ENCRYPTION_KEY and picked up automatically by Godot's SConstruct.
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload build artifacts.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build-macos:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    if: matrix.target == inputs.target
    runs-on: macos-26
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor x86_64
            cache-name: macos-editor-x86_64
            target: editor
            arch: x86_64

          - name: Editor arm64
            cache-name: macos-editor-arm64
            target: editor
            arch: arm64

          - name: Template x86_64
            cache-name: macos-template-x86_64
            target: template_release
            arch: x86_64
            scons-flags: debug_symbols=no

          - name: Template arm64
            cache-name: macos-template-arm64
            target: template_release
            arch: arm64
            scons-flags: debug_symbols=no

    steps:
      - name: Checkout engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GIT_PAT || github.token }}
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ inputs.repo-safe || replace(inputs.repository, '/', '_') }}-${{ matrix.cache-name }}
          engine-sha: ${{ inputs.engine-sha }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python3 ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python3 ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Inject build configuration (custom.py / .gdbuild / custom modules / env)
        id: inject
        uses: ./.github/actions/godot-config-inject
        with:
          profile: ${{ inputs.profile }}
          gdbuild: ${{ inputs.gdbuild }}
          custom-modules: ${{ inputs.custom-modules }}
          encryption-key: ${{ inputs.encryption-key }}
          repo-token: ${{ secrets.GIT_PAT }}

      - name: Compilation (${{ matrix.arch }})
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ matrix.scons-flags }} ${{ inputs.scons-flags }} arch=${{ matrix.arch }} vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ inputs.target }}
          build-profile: ${{ steps.inject.outputs.build-profile }}
          profile-path: ${{ steps.inject.outputs.profile-path }}
          custom-modules-dir: ${{ steps.inject.outputs.custom-modules-dir }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ inputs.repo-safe || replace(inputs.repository, '/', '_') }}-${{ matrix.cache-name }}
          engine-sha: ${{ inputs.engine-sha }}
        continue-on-error: true

      - name: Prepare artifact
        if: inputs.upload-artifact
        run: |
          rm -rf ./bin/build_deps
          strip bin/godot.* || true
          chmod +x bin/godot.*

      - name: Upload artifact
        if: inputs.upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.repo-safe || replace(inputs.repository, '/', '_') }}-${{ matrix.cache-name }}
          path: bin/godot.macos.${{ inputs.target }}.${{ matrix.arch }}

  merge-macos:
    needs: build-macos
    if: matrix.target == inputs.target
    runs-on: macos-26
    name: Merge ${{ matrix.name }} (universal)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor
            target: editor
          - name: Template
            target: template_release

    steps:
      - name: Download arch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.repo-safe || replace(inputs.repository, '/', '_') }}-macos-${{ matrix.target }}-*
          path: build/
          merge-multiple: true

      - name: Merge universal binary
        run: |
          ls -la build/
          lipo -create ./build/godot.macos.${{ matrix.target }}.x86_64 ./build/godot.macos.${{ matrix.target }}.arm64 -output ./build/godot.macos.${{ matrix.target }}.universal
          rm ./build/godot.macos.${{ matrix.target }}.x86_64 ./build/godot.macos.${{ matrix.target }}.arm64
          strip ./build/godot.macos.${{ matrix.target }}.universal || true
          chmod +x ./build/godot.macos.${{ matrix.target }}.universal

      - name: Upload artifact
        if: inputs.upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.repo-safe || replace(inputs.repository, '/', '_') }}-macos-${{ matrix.target }}
          path: ./build/godot.macos.${{ matrix.target }}.universal

      - name: Smoke test
        run: |
          ./build/godot.macos.${{ matrix.target }}.universal --version