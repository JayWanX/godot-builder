name: 🌐 Web Builds
on:
  workflow_call:
    inputs:
      repository:
        description: Godot engine source repository (owner/repo).
        required: false
        default: godotengine/godot
        type: string
      repo-safe:
        description: Repository name with '/' replaced by '_' (safe for artifact names).
        required: false
        default: ""
        type: string
      engine-sha:
        description: Resolved commit SHA of the engine ref (cache key stability).
        required: false
        default: ""
        type: string
      ref:
        description: Branch, tag, or commit SHA of the engine source.
        required: false
        default: master
        type: string
      target:
        description: Build target (editor, template_debug, template_release).
        required: false
        default: template_release
        type: string
      scons-flags:
        description: Additional SCons flags appended to the build.
        required: false
        default: ""
        type: string
      profile:
        description: >-
          custom.py source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      gdbuild:
        description: >-
          .gdbuild build profile source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      custom-modules:
        description: Comma-separated custom module repositories in "owner/repo[@ref]" form.
        required: false
        default: ""
        type: string
      encryption-key:
        description: >-
          Godot script encryption key (hexadecimal string). Exported as
          SCRIPT_AES256_ENCRYPTION_KEY and picked up automatically by Godot's SConstruct.
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload build artifacts.
        required: false
        default: true
        type: boolean
    secrets:
      GIT_PAT:
        description: "GitHub token for private repositories (repo: mode / custom-modules)."
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: Godot engine source repository (owner/repo).
        required: false
        default: godotengine/godot
        type: string
      repo-safe:
        description: Repository name with '/' replaced by '_' (safe for artifact names).
        required: false
        default: ""
        type: string
      engine-sha:
        description: Resolved commit SHA of the engine ref (cache key stability).
        required: false
        default: ""
        type: string
      ref:
        description: Branch, tag, or commit SHA of the engine source.
        required: false
        default: master
        type: string
      target:
        description: Build target.
        required: false
        default: template_release
        type: choice
        options: [editor, template_debug, template_release]
      scons-flags:
        description: Additional SCons flags appended to the build.
        required: false
        default: ""
        type: string
      profile:
        description: >-
          custom.py source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      gdbuild:
        description: >-
          .gdbuild build profile source (empty = skip, inline:<base64>, file:<path>,
          repo:<owner/repo>[@<ref>]:<path>).
        required: false
        default: ""
        type: string
      custom-modules:
        description: Comma-separated custom module repositories in "owner/repo[@ref]" form.
        required: false
        default: ""
        type: string
      encryption-key:
        description: >-
          Godot script encryption key (hexadecimal string). Exported as
          SCRIPT_AES256_ENCRYPTION_KEY and picked up automatically by Godot's SConstruct.
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload build artifacts.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Global Settings
env:
  EM_VERSION: 4.0.11

jobs:
  web-template:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Template w/ threads, 64-bit (target=template_release, threads=yes, arch=wasm64)
            cache-name: web-template
            target: template_release
            scons-flags: threads=yes arch=wasm64

          - name: Template w/o threads, 32-bit (target=template_release, threads=no, arch=wasm32)
            cache-name: web-nothreads-template
            target: template_release
            scons-flags: threads=no arch=wasm32

    steps:
      - name: Checkout engine source
        if: matrix.target == inputs.target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GIT_PAT || github.token }}
          submodules: recursive

      - name: Set up Emscripten latest
        if: matrix.target == inputs.target
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EM_VERSION }}

      - name: Verify Emscripten setup
        if: matrix.target == inputs.target
        run: |
          emcc -v

      - name: Restore Godot build cache
        if: matrix.target == inputs.target
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ inputs.repo-safe || github.event.repository.name }}-${{ matrix.cache-name }}
          engine-sha: ${{ inputs.engine-sha }}
        continue-on-error: true

      - name: Setup Python and SCons
        if: matrix.target == inputs.target
        uses: ./.github/actions/godot-deps

      - name: Inject build configuration (custom.py / .gdbuild / custom modules / env)
        if: matrix.target == inputs.target
        id: inject
        uses: ./.github/actions/godot-config-inject
        with:
          profile: ${{ inputs.profile }}
          gdbuild: ${{ inputs.gdbuild }}
          custom-modules: ${{ inputs.custom-modules }}
          encryption-key: ${{ inputs.encryption-key }}
          repo-token: ${{ secrets.GIT_PAT }}

      - name: 检出 GodotBuilder 辅助脚本
        if: matrix.target == inputs.target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: godot_builder
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/scripts

      - name: 确保标准头显式包含（兼容新版编译器）
        if: matrix.target == inputs.target
        run: python godot_builder/.github/scripts/ensure_standard_includes.py

      - name: Compilation
        if: matrix.target == inputs.target
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ matrix.scons-flags }} ${{ inputs.scons-flags }}
          platform: web
          target: ${{ inputs.target }}
          build-profile: ${{ steps.inject.outputs.build-profile }}
          profile-path: ${{ steps.inject.outputs.profile-path }}
          custom-modules-dir: ${{ steps.inject.outputs.custom-modules-dir }}

      - name: Save Godot build cache
        if: matrix.target == inputs.target
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ inputs.repo-safe || github.event.repository.name }}-${{ matrix.cache-name }}
          engine-sha: ${{ inputs.engine-sha }}
        continue-on-error: true

      - name: Upload artifact
        if: matrix.target == inputs.target && inputs.upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.repo-safe || github.event.repository.name }}-${{ matrix.cache-name }}
