name: Restore Godot build cache
description: Restore Godot build cache.
inputs:
  cache-name:
    description: The cache base name (job name by default).
    default: ${{ github.job }}
  engine-sha:
    description: Resolved commit SHA of the engine ref for stable cache keys.
    default: ""
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/

runs:
  using: composite
  steps:
    - name: Restore cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.scons-cache }}
        # Exact hit when the same engine commit is rebuilt; falls back to the latest
        # save for the engine commit, then the current branch, then the default branch
        # (so PRs can integrate changes from the default branch).
        key: ${{ inputs.cache-name }}|${{ inputs.engine-sha || github.ref_name }}|${{ github.sha }}
        restore-keys: |
          ${{ inputs.cache-name }}|${{ inputs.engine-sha || github.ref_name }}
          ${{ inputs.cache-name }}|${{ github.ref_name }}
          ${{ inputs.cache-name }}|${{ github.event.repository.default_branch }}

    - name: Store unix timestamp
      shell: sh
      run: echo "CACHE_TIMESTAMP=$(date +%s)" >> $GITHUB_ENV
